services:
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.23-jammy
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
      - db_init:/docker-entrypoint-initdb.d:ro
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=amidsDB
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    expose:
      - 3306
      - 33060
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 4
      start_period: 30s
  wordpress:
    image: wordpress:php8.3-apache
    container_name: wordpress
    volumes:
      - wp_data:/var/www/html
    ports:
      - 80:80
    restart: always
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=user
      - WORDPRESS_DB_PASSWORD=password
      - WORDPRESS_DB_NAME=amidsDB
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    restart: always
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/db
  db_init:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./initdb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/wp
